<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IncidentIQ</title><style>body{font:16px system-ui;max-width:850px;margin:3rem auto;padding:0 1rem;color:#172033}textarea,input{width:100%;box-sizing:border-box;padding:.7rem;margin:.3rem 0 1rem}button{background:#1769aa;color:white;border:0;padding:.75rem 1rem;border-radius:.3rem}pre{white-space:pre-wrap;background:#f3f6f8;padding:1rem;border-radius:.3rem}.note{color:#536273}</style></head>
<body><h1>IncidentIQ</h1><p class="note">Synthetic incident-analysis demo. Do not submit production secrets or personal data.</p>
<form id="form"><label>Ticket ID<input id="ticket" value="DEMO-001" required></label><label>Job name<input id="job" value="reconciliation-worker" required></label><label>Description<textarea id="description" required>Batch job exceeded its memory limit while processing a large input.</textarea></label><label>Log excerpt<textarea id="log" required>ERROR: out of memory while processing records</textarea></label><label>Optional script name<input id="script"></label><button>Investigate</button></form><pre id="result" aria-live="polite"></pre>
<script>const form=document.querySelector('#form'),out=document.querySelector('#result');form.addEventListener('submit',async e=>{e.preventDefault();out.textContent='Investigating…';try{const r=await fetch('/api/v1/investigations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket_id:ticket.value,job_name:job.value,description:description.value,log_excerpt:log.value,script_name:script.value||null})});const body=await r.json();out.textContent=r.ok?JSON.stringify(body,null,2):body.detail||'Request failed';}catch{out.textContent='Network error. Is the API running?';}});</script></body></html>
