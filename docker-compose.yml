services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      RAG_USE_CHROMADB: ${RAG_USE_CHROMADB:-false}
      LLM_ENABLED: ${LLM_ENABLED:-false}
    volumes:
      - chroma_data:/app/chroma_data

volumes:
  chroma_data:
